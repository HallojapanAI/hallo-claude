# hallo-security · Rule secret của HalloJapan — BẢN GỐC: hallo-claude/shared/security/gitleaks.toml (do /sec:harden chép vào repo).
# Dùng bởi: gitleaks (CI, máy có cài) và scripts/secret-scan.mjs (hook pre-commit khi máy chưa có gitleaks).
# Regex phải chạy được trên cả Go RE2 và JavaScript: chỉ dùng (?i) ở đầu, không lookbehind.
title = "hallo secret rules"

[extend]
useDefault = true

[[rules]]
id = "hallo-url-password"
description = "URL Postgres/Redis/MySQL/Mongo có mật khẩu"
regex = '''(?i)(?:postgres(?:ql)?|redis|rediss|mysql|mongodb(?:\+srv)?)://[^:@/\s'"]*:([^@/\s'"]{3,})@'''
secretGroup = 1

[[rules]]
id = "hallo-env-secret"
description = "Biến bí mật mang giá trị thật trong file .env*"
path = '''(?i)(?:^|/)\.env(?:\.[\w.-]+)?$'''
regex = '''(?i)(?:^|[\r\n])[ \t]*(?:export[ \t]+)?[A-Z0-9_]*(?:SECRET|TOKEN|PASSWORD|PASSWD|PASS|API_KEY|PRIVATE_KEY|ENCRYPTION_KEY|CLIENT_SECRET)[A-Z0-9_]*[ \t]*=[ \t]*["']?([^\s"'#]{6,})'''
secretGroup = 1

[[rules]]
id = "hallo-openai-key"
description = "Khóa OpenAI"
regex = '''\b(sk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{20,})'''
secretGroup = 1

[[rules]]
id = "hallo-github-token"
description = "Token GitHub"
regex = '''\b((?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{40,})'''
secretGroup = 1

[[rules]]
id = "hallo-aws-key"
description = "Access key AWS"
regex = '''\b((?:AKIA|ASIA)[0-9A-Z]{16})\b'''
secretGroup = 1

[[rules]]
id = "hallo-private-key"
description = "Khóa riêng (PEM/OpenSSH)"
regex = '''(-----BEGIN [A-Z ]*PRIVATE KEY-----)'''
secretGroup = 1

[[rules]]
id = "hallo-personal-path"
description = "Đường dẫn home cá nhân (/home/<user>, /Users/<user>) — R-008"
regex = '''(?:/home|/Users)/([a-z][a-z0-9._-]{1,31})/'''
secretGroup = 1

[[rules]]
id = "hallo-personal-email"
description = "Email cá nhân (gmail/yahoo/outlook/hotmail/icloud) — R-008"
regex = '''(?i)\b([a-z0-9._%+-]+@(?:gmail|googlemail|yahoo|outlook|hotmail|icloud|live)\.(?:com|co\.jp|jp))\b'''
secretGroup = 1

[allowlist]
description = "Placeholder và giá trị mẫu"
# So với phần secret bắt được (secretGroup).
regexes = [
  '''^x{4,}$''',
  '''(?i)^(?:changeme|change-me|placeholder|example|redacted|dummy|test|secret|password|pass|your[-_].*|<.*>|\$\{.*\}|\$[A-Z_]+)$''',
  '''(?i)^(?:user|username|runner|ubuntu|deploy|node|me|you|example|name|tên|ten)$''',
  '''(?i)^(?:noreply|no-reply|example|test|user)@''',
  # Giá trị giả: phải BẮT ĐẦU bằng test/fake/dummy/sample/example (neo đầu–cuối, không khớp chuỗi con).
  # Fixture khác → comment `gitleaks:allow` trên đúng dòng.
  '''(?i)^(?:sk-(?:proj-)?)?(?:test|fake|dummy|sample|example)[\w.-]*$''',
  # Mô tả trong ngoặc nhọn, vd SMTP_PASSWORD=<16-character App Password>
  '''^<''',
]
paths = [
  '''(?:^|/)package-lock\.json$''',
  '''(?:^|/)\.gitleaks\.toml$''',
  '''(?:^|/)\.gitleaksignore$''',
]
